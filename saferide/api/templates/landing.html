{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeRide - Landing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .bg-hero-bg {
      background: linear-gradient(135deg, #0b1224 0%, #0b1b2b 100%);
    }
    .font-Bellefair { font-family: 'Bellefair', serif; }
  </style>
</head>
<body class="bg-hero-bg">
  <section class="h-screen overflow-hidden bg-hero-bg">
    <nav class="flex items-center justify-between px-6 py-4">
      <div class="text-white text-xl font-bold">SafeRide</div>
      <div class="space-x-6">
        <a class="text-[#d2d8f9]" href="#">Home</a>
        <a class="text-[#d2d8f9]" href="#">Services</a>
        <a class="text-[#d2d8f9]" href="#">Contact</a>
        <a class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded hover:bg-indigo-500" href="/login">Login</a>
        <a class="px-4 py-2 text-sm font-semibold text-indigo-600 bg-white rounded hover:bg-gray-100" href="/register">Register</a>
      </div>
    </nav>

    <div class="px-2 pt-5 text-center md:container md:text-left">
      <h1 class="text-4xl font-bold tracking-wide text-white">
        <span class="text-[#00c6ff]">TRAVEL</span> AROUND THE COUNTRY WITH A <span class="text-[#00c6ff]">SAFE RIDE</span>
      </h1>
      <div class="items-center pt-6 md:flex md:justify-between">
        <img src="{% static 'img/map.png' %}" alt="Map" onerror="this.style.display='none'"
             class="md:w-[36%] w-[52%] md:mx-0 mx-auto md:py-0 py-4" />

        <div class="md:w-1/2">
          <ul id="locations" class="pb-4 text-white"></ul>

          <h1 id="title" class="w-full pb-2 text-white font-Bellefair text-7xl"></h1>
          <p id="description" class="text-[#d2d8f9] font-extralight text-sm md:w-2/3 md:pl-1 leading-6 tracking-wide pb-10 border-b-[0.5px] border-[#ffffff66]"></p>

          <div class="flex justify-around w-auto pt-10 md:justify-between lg:w-1/2">
            <div>
              <span class="text-[#d2d8f9] text-sm">Avg. distance</span>
              <h1 id="avgDistance" class="text-xl text-white"></h1>
            </div>
            <div>
              <span class="text-[#d2d8f9] text-sm">Est. travel time</span>
              <h1 id="travelTime" class="text-xl text-white"></h1>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  {{ content|json_script:"content-data" }}
  <script>
    const content = JSON.parse(document.getElementById('content-data').textContent);
    let selectedLocation = Object.keys(content)[0];

    function render() {
      const locationsEl = document.getElementById('locations');
      locationsEl.innerHTML = '';
      Object.keys(content).forEach(location => {
        const li = document.createElement('li');
        li.textContent = location;
        li.className = `inline-block mx-4 border-b-2 cursor-pointer md:mr-8 md:mx-0 md:ml-2 ${selectedLocation === location ? 'border-white' : 'border-transparent'}`;
        li.onclick = () => { selectedLocation = location; render(); };
        locationsEl.appendChild(li);
      });

      document.getElementById('title').textContent = content[selectedLocation].title;
      document.getElementById('description').textContent = content[selectedLocation].description;
      document.getElementById('avgDistance').textContent = content[selectedLocation].avgDistance;
      document.getElementById('travelTime').textContent = content[selectedLocation].travelTime;
    }
    render();
  </script>
</body>
</html>

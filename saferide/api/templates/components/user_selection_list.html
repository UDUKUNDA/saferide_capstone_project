<!-- User Selection List Component -->
<div id="user-selection-component" class="max-w-md p-6 text-gray-900 bg-white rounded-lg shadow-md border border-gray-200 dark:bg-gray-900 dark:text-gray-100 dark:border-gray-700">
    <p id="user-list-title" class="text-lg font-semibold text-center mb-4">Select User</p>
    
    <div id="user-list-loader" class="text-center py-4 text-gray-500 hidden">
        <i class="fas fa-spinner fa-spin"></i> Loading users...
    </div>

    <ul id="user-list-container" class="mt-2 space-y-2 max-h-96 overflow-y-auto">
        <!-- Users will be injected here -->
        <li class="text-center text-gray-500 py-4">No users available</li>
    </ul>
</div>

<script>
    /**
     * Renders a list of users for chat selection.
     * @param {Array} users - Array of user objects { _id, username, roleKey }
     * @param {Array} onlineUsers - Array of online user objects { userId }
     * @param {string} title - Title of the list
     * @param {Function} onSelectUser - Callback function when a user is clicked
     */
    function renderUserSelectionList(users, onlineUsers, title, onSelectUser) {
        const container = document.getElementById('user-list-container');
        const titleEl = document.getElementById('user-list-title');
        
        if (title) titleEl.innerText = title;
        container.innerHTML = '';

        if (!users || users.length === 0) {
            container.innerHTML = '<li class="text-center text-gray-500 py-4">No users found.</li>';
            return;
        }

        users.forEach(user => {
            const isOnline = onlineUsers?.some(u => u.userId === user._id || u.userId === user.id); // Handle both _id and id
            
            const li = document.createElement('li');
            li.className = "flex items-center p-3 rounded-md cursor-pointer transition-colors duration-200 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700";
            
            li.innerHTML = `
                <span class="w-3 h-3 mr-3 rounded-full ${isOnline ? 'bg-green-500 shadow-[0_0_5px_rgba(34,197,94,0.6)]' : 'bg-red-400'}"></span>
                <div class="flex-1">
                    <p class="font-medium text-sm">${user.username}</p>
                    <p class="text-xs text-gray-500 dark:text-gray-400 capitalize">${user.roleKey || 'User'}</p>
                </div>
                ${isOnline ? '<span class="px-2 py-0.5 ml-auto text-xs font-semibold text-green-800 bg-green-100 rounded-full dark:bg-green-900 dark:text-green-200">Online</span>' : ''}
            `;
            
            li.onclick = () => {
                if (onSelectUser) {
                    onSelectUser(user._id || user.id);
                } else {
                    console.warn('No onSelectUser callback provided');
                }
            };

            container.appendChild(li);
        });
    }

    // --- Mock Usage / Helper for Integration ---
    // You can call this function from your main page script to initialize the component

    // const mockOnline = [{userId: '1'}];
    // renderUserSelectionList(mockUsers, mockOnline, "Choose a Driver", (id) => createChat(id));
</script>

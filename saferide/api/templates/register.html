{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeRide - Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translate3d(0, 20px, 0);
        }
        to {
            opacity: 1;
            transform: none;
        }
    }
    .animate-fade-in-up {
        animation: fadeInUp 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="bg-gray-900">
  <div class="grid w-full h-screen grid-cols-1 sm:grid-cols-2">
    <div class="hidden sm:block">
      <img class="object-cover w-full h-full" src="{% static 'img/dash.jpg' %}" alt="" onerror="this.style.display='none'"/>
    </div>
    <div class="flex flex-col justify-center">
      <form id="register-form" class="max-w-[400px] w-full mx-auto bg-white p-4 rounded-2xl">
        <h2 class="py-6 text-4xl font-bold text-center text-indigo-600">SafeRide</h2>
        <p id="error" class="text-red-600 hidden"></p>
        <div class="flex flex-col py-2">
          <label for="username">Username</label>
          <input class="p-2 border rounded-lg" type="text" id="username" required />
        </div>
        <div class="flex flex-col py-2">
          <label for="email">Email</label>
          <input class="p-2 border rounded-lg" type="email" id="email" required />
        </div>
        <div class="flex flex-col py-2">
          <label for="phone">Phone</label>
          <input class="p-2 border rounded-lg" type="tel" id="phone" required />
        </div>
        <div class="flex flex-col py-2">
          <label for="password">Password</label>
          <input class="p-2 py-2 border rounded-lg" type="password" id="password" required />
        </div>
        <div class="flex flex-col py-2">
          <label for="city">City</label>
          <select class="w-full p-2 border rounded-lg" id="city" required>
            <option value="">--------------select a city------------------</option>
            <option value="Kigali">Kigali City</option>
            <option value="Butare">Butare</option>
            <option value="Gitarama">Gitarama</option>
            <option value="Gisenyi">Gisenyi</option>
            <option value="Ruhengeri">Ruhengeri</option>
            <option value="Byumba">Byumba</option>
            <option value="Cyangugu">Cyangugu</option>
            <option value="Kibuye">Kibuye</option>
            <option value="Rwamagana">Rwamagana</option>
            <option value="Kibungo">Kibungo</option>
            <option value="Nyanza">Nyanza</option>
            <option value="Nyagatare">Nyagatare</option>
            <option value="Muhanga">Muhanga</option>
            <option value="Musanze">Musanze</option>
            <option value="Huye">Huye</option>
            <option value="Karongi">Karongi</option>
            <option value="Nyamasheke">Nyamasheke</option>
            <option value="Rusizi">Rusizi</option>
            <option value="Rubavu">Rubavu</option>
            <option value="Ngororero">Ngororero</option>
            <option value="Bugesera">Bugesera</option>
            <option value="Nyamagabe">Nyamagabe</option>
            <option value="Kayonza">Kayonza</option>
            <option value="Gicumbi">Gicumbi</option>
            <option value="Rutsiro">Rutsiro</option>
            <option value="Gakenke">Gakenke</option>
            <option value="Kamonyi">Kamonyi</option>
            <option value="Burera">Burera</option>
            <option value="Ngoma">Ngoma</option>
            <option value="Nyaruguru">Nyaruguru</option>
            <option value="Rulindo">Rulindo</option>
            <option value="Nyarugenge">Nyarugenge</option>
            <option value="Gasabo">Gasabo</option>
            <option value="Kicukiro">Kicukiro</option>
          </select>
        </div>
        
        <!-- Location Status -->
        <div class="py-2">
           <p id="location-status" class="text-sm text-gray-500">📍 Waiting for location...</p>
        </div>

        <button class="w-full my-5 text-white bg-indigo-600 border rounded-lg hover:bg-indigo-500">Sign up</button>
        <div class="flex justify-center gap-2">
          <p>Already have an account?</p>
          <a class="text-indigo-600 hover:underline" href="/login">Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Role Selection Modal -->
  <div id="role-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70">
    <div class="w-full max-w-lg p-6 bg-white rounded-2xl animate-fade-in-up">
      <h2 class="mb-6 text-3xl font-bold text-center text-indigo-600">Choose Your Role</h2>
      <p class="mb-8 text-center text-gray-600">How would you like to join SafeRide?</p>
      
      <div class="grid gap-4">
        <button onclick="selectRole('driver')" class="flex items-center p-4 transition border-2 border-gray-200 rounded-xl hover:border-indigo-600 hover:bg-indigo-50 group">
          <div class="p-3 mr-4 text-white bg-indigo-600 rounded-full">
            🚗
          </div>
          <div class="text-left">
            <h3 class="text-lg font-bold text-gray-800 group-hover:text-indigo-700">Driver</h3>
            <p class="text-sm text-gray-500">I want to drive passengers.</p>
          </div>
        </button>

        <button onclick="selectRole('rider')" class="flex items-center p-4 transition border-2 border-gray-200 rounded-xl hover:border-indigo-600 hover:bg-indigo-50 group">
          <div class="p-3 mr-4 text-white bg-orange-500 rounded-full">
            🏍️
          </div>
          <div class="text-left">
            <h3 class="text-lg font-bold text-gray-800 group-hover:text-indigo-700">Motorcycle Rider</h3>
            <p class="text-sm text-gray-500">I want to ride a moto taxi.</p>
          </div>
        </button>

        <button onclick="selectRole('user')" class="flex items-center p-4 transition border-2 border-gray-200 rounded-xl hover:border-indigo-600 hover:bg-indigo-50 group">
          <div class="p-3 mr-4 text-white bg-green-500 rounded-full">
            👤
          </div>
          <div class="text-left">
            <h3 class="text-lg font-bold text-gray-800 group-hover:text-indigo-700">Customer</h3>
            <p class="text-sm text-gray-500">I want to request rides.</p>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- Loading Modal -->
  <div id="loading-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black bg-opacity-70">
    <div class="flex flex-col items-center p-8 bg-white rounded-2xl animate-fade-in-up">
      <div class="w-12 h-12 mb-4 border-4 border-indigo-200 rounded-full animate-spin border-t-indigo-600"></div>
      <h3 class="text-xl font-bold text-gray-800">Registering...</h3>
      <p class="text-gray-500">Please wait while we create your account.</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('register-form');
    const errorEl = document.getElementById('error');
    const locStatus = document.getElementById('location-status');
    const roleModal = document.getElementById('role-modal');
    const loadingModal = document.getElementById('loading-modal');
    
    let userLat = null;
    let userLng = null;
    let selectedRole = 'user'; // Default

    // Function to handle role selection
    function selectRole(role) {
      selectedRole = role;
      // Close modal
      roleModal.style.display = 'none';
      
      // Update form title or add badge to show selected role (Optional visual feedback)
      const title = document.querySelector('h2.text-indigo-600');
      if (title) {
        const roleName = role === 'rider' ? 'Moto Rider' : role.charAt(0).toUpperCase() + role.slice(1);
        title.innerHTML = `SafeRide <span class="block text-lg font-normal text-gray-500">(${roleName})</span>`;
      }
    }

    // Ensure modal is visible on load
    // (It's visible by default in HTML, but we can ensure it if needed)

    // Get Location on Load
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                userLat = position.coords.latitude;
                userLng = position.coords.longitude;
                locStatus.textContent = "📍 Location acquired";
                locStatus.classList.remove('text-gray-500');
                locStatus.classList.add('text-green-600');
            },
            (error) => {
                console.error("Geolocation error:", error);
                locStatus.textContent = "⚠️ Location denied or unavailable (will register without it)";
                locStatus.classList.remove('text-gray-500');
                locStatus.classList.add('text-orange-500');
            }
        );
    } else {
        locStatus.textContent = "❌ Geolocation not supported by this browser";
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      errorEl.textContent = '';
      loadingModal.classList.remove('hidden'); // Show loading modal

      const payload = {
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        password: document.getElementById('password').value,
        city: document.getElementById('city').value,
        roleKey: selectedRole,
        latitude: userLat,
        longitude: userLng
      };
      try {
        const res = await fetch('/api/register/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
          let errorMessage = data.message || 'Registration failed';
          
          if (data.errors) {
            // Create a cleaner list of errors
            const errorDetails = [];
            for (const [key, value] of Object.entries(data.errors)) {
              const fieldName = key === 'non_field_errors' ? '' : `${key.charAt(0).toUpperCase() + key.slice(1)}: `;
              const message = Array.isArray(value) ? value[0] : value;
              errorDetails.push(`${fieldName}${message}`);
            }
            if (errorDetails.length > 0) {
              errorMessage = errorDetails.join('\n');
            }
          }
          throw new Error(errorMessage);
        }
        // alert('Registration successful. Please sign in.'); // Removed alert
        window.location.href = '/login';
      } catch (err) {
        loadingModal.classList.add('hidden'); // Hide loading modal on error
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
